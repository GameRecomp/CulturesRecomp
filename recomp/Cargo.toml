# SPDX-License-Identifier: MIT
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
publish = false

[workspace.dependencies]
rc-pe = { path = "crates/rc-pe" }
rc-manifest = { path = "crates/rc-manifest" }
rc-media = { path = "crates/rc-media" }
rc-discover = { path = "crates/rc-discover" }
rc-ir = { path = "crates/rc-ir" }
rc-x86 = { path = "crates/rc-x86" }
rc-emit-c = { path = "crates/rc-emit-c" }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1
