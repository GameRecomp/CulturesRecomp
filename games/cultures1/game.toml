# --- discovery hints ---------------------------------------------------------
# Hints go into a [binary.discover] table right after the [[binary]] they belong to
# (addresses are virtual addresses after rebasing). `recomp discover` classifies more than
# 99.9 % of every C1 code section on its own (docs/RESEARCH.md); `--verbose` lists the
# `no-return?` candidates, which are checked by hand before they become hints.
#
# [binary.discover]
# seeds = [0x401000]                                # extra function entry points
# no_return = [0x401000]                            # functions that never return
# data = [{ start = 0x401000, end = 0x401010 }]     # data inside a code section
# jump_tables = [{ at = 0x401000, table = 0x401010, count = 4 }]
